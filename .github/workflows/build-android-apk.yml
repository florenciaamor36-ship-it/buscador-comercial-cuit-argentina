name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'worker/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare stable APK signing key
        env:
          BUSCADOR_SIGNING_KEYSTORE_B64: ${{ secrets.BUSCADOR_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$BUSCADOR_SIGNING_KEYSTORE_B64"
          printf '%s' "$BUSCADOR_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/buscador-signing.p12"
          chmod 600 "$RUNNER_TEMP/buscador-signing.p12"
          printf 'BUSCADOR_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/buscador-signing.p12" >> "$GITHUB_ENV"

      - name: Build installable debug APK
        env:
          BUSCADOR_SIGNING_STORE_PASSWORD: ${{ secrets.BUSCADOR_SIGNING_STORE_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: buscador-comercial-pro-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/buscador-signing.p12"
