plugins {
    id 'com.android.application'
}

def stableKeystorePath = System.getenv('BUSCADOR_SIGNING_KEYSTORE')
def stableKeystorePassword = System.getenv('BUSCADOR_SIGNING_STORE_PASSWORD')

android {
    namespace 'ar.laclave.buscador'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.laclave.buscador'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (stableKeystorePath && stableKeystorePassword) {
        signingConfigs {
            stable {
                storeFile file(stableKeystorePath)
                storePassword stableKeystorePassword
                keyAlias 'buscador-stable'
                keyPassword stableKeystorePassword
                storeType 'PKCS12'
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.stable
            }
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
